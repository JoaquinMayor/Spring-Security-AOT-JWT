spring.application.name=Spring-Security-AOT-JWT

# =====================================================================
#  BASE DE DATOS (H2 en memoria)
#  Se crea al arrancar y se borra al apagar. No hay que instalar nada.
# =====================================================================
spring.datasource.url=jdbc:h2:mem:clasesdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# =====================================================================
#  CLASE 15 - JWT
#  La clave secreta firma los tokens. Quien la tenga puede FABRICAR tokens validos,
#  por eso NUNCA se escribe en el codigo (ver Clase 16: gestion de secretos).
#  Sintaxis ${VARIABLE:valorPorDefecto}: primero busca la variable de entorno JWT_SECRET;
#  si no existe usa el valor por defecto (SOLO para desarrollo local).
#  En produccion se usa el perfil "prod", que NO tiene valores por defecto.
# =====================================================================
app.jwt.secret=${JWT_SECRET:KBtavLjOV9mfAKam896OUIZd8kjUGmqcyp13q6sW0n8=}
# Tiempo de vida del token en milisegundos (3600000 ms = 1 hora)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# =====================================================================
#  CLASE 15 - OAuth2 (login con Google y GitHub)
#  Cada proveedor te da un client-id y un client-secret al registrar tu app:
#   - Google: https://console.cloud.google.com/apis/credentials
#     Redirect URI: http://localhost:8080/login/oauth2/code/google
#   - GitHub: https://github.com/settings/developers  (OAuth Apps)
#     Callback URL: http://localhost:8080/login/oauth2/code/github
#  Mientras no completes estos valores la app arranca igual, pero el login social fallara.
# =====================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:reemplazar-por-tu-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:reemplazar-por-tu-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:reemplazar-por-tu-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:reemplazar-por-tu-client-secret}

# =====================================================================
#  CLASE 16 - Credenciales y cifrado
# =====================================================================
# Clave AES de 256 bits (32 bytes) codificada en Base64. Sirve para cifrar datos RECUPERABLES.
app.crypto.aes-key=${AES_KEY:iZETtmnx+RGG47uhknTztg7UwUKUhzMFc91r8RotHeM=}
# "Pepper": secreto que se mezcla con la contrasena antes del hash y se guarda FUERA de la base de datos.
app.security.password-pepper=${PASSWORD_PEPPER:LoWC7jc9WMmq00bhiI/PgGUgPc6b9qIw}
# Cost factor de BCrypt: 2^12 = 4096 iteraciones.
app.security.bcrypt-strength=12

# =====================================================================
#  CLASE 17 - Prevencion de vulnerabilidades
# =====================================================================
# Endpoints INTENCIONALMENTE vulnerables para demostrar SQL Injection / NoSQL Injection en clase.
# NUNCA activar esto fuera de un entorno de practica.
app.demos.vulnerables.enabled=true

# "Nunca revelar errores del backend al usuario": no mostrar stacktraces ni mensajes internos.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false

# =====================================================================
#  Swagger UI  ->  http://localhost:8080/swagger-ui.html
# =====================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Para VER por dentro como trabaja Spring Security (filtros, AuthenticationManager, etc.)
# cambia INFO por TRACE. Muy util para aprender, muy ruidoso para el dia a dia.
logging.level.org.springframework.security=INFO
