# =====================================================================
#  PERFIL DE PRODUCCION  (se activa con: --spring.profiles.active=prod)
#  CLASE 16: en produccion los secretos NO tienen valor por defecto.
#  Si falta alguna variable de entorno, la aplicacion NO arranca (falla rapido y avisa),
#  en lugar de arrancar silenciosamente con una clave conocida por todos.
# =====================================================================
app.jwt.secret=${JWT_SECRET}
app.crypto.aes-key=${AES_KEY}
app.security.password-pepper=${PASSWORD_PEPPER}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

# CLASE 17: los endpoints vulnerables de demostracion quedan apagados.
app.demos.vulnerables.enabled=false

# Swagger no se expone en produccion.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
